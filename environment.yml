# 강좌 실습 환경 mdai (분자동역학 MD + 인공지능 AI) · 내 컴퓨터(또는 연구실 서버)에 한 번 만든다
#   conda env create -f environment.yml      (처음 1회 · 10~20분)
#   conda activate mdai                      (터미널을 열 때마다)
# Windows 는 WSL2 Ubuntu 안에서 만든다(LAMMPS · AmberTools · Claude Code).
# 설치 지시문(Claude Code 에 붙여 넣기) = docs/install_prompts.md
name: mdai
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - pandas
  - matplotlib
  - scikit-learn
  - xgboost
  - rdkit
  - shap
  - pyyaml
  - jupyterlab
  - nbconvert
  - nbclient
  - ipykernel
  - lammps=2025.07.22=cpu_*_nompi_*   # W06~ · 실행 파일 lmp · CPU 판(GPU 불필요) · 여러 코어 = OpenMP(-sf omp)
  - ambertools                        # W04~ · antechamber · parmchk2 · sqm = GAFF2 타입 · AM1-BCC 전하 · packmol(W06~ 분자 상자 채우기)도 여기 들어 있음
  - git
